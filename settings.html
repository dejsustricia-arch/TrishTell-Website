<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — TrishTell</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="header-nav"><a href="dashboard.html" class="brand-logo">← Back</a></header>

    <div class="card">
      <div id="status-alert" class="alert"></div>
      <form id="settings-form">
        <div class="form-group"><label>Display Name</label><input type="text" id="display-name-input" required></div>
        <div class="form-group"><label>Prompt / Bio</label><textarea id="bio-input"></textarea></div>
        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
          <label style="margin: 0;">Accept New Messages</label>
          <input type="checkbox" id="allow-messages-toggle" style="width: auto;">
        </div>
        <button type="submit" class="btn">Save Changes</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initSettings } from './js/settings.js';
    initSettings();
  </script>
</body>
</html>
