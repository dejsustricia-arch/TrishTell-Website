<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Trishtell</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
</head>
<body>
  <div class="app-container">
    <header class="header-nav">
      <a href="index.html" class="brand-logo">♡ TrishTell</a>
    </header>

    <div class="card">
      <h2>Create Your Account</h2>
      <div id="error-alert" class="alert alert-error"></div>

      <form id="signup-form">
        <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="Enter Username 𖹭" required pattern="[a-zA-Z0-9_]+"></div>
        <div class="form-group"><label>Display Name</label><input type="text" id="display-name" placeholder="Enter Name ♡" required></div>
        <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@example.com" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="password" minlength="6" required></div>
        <button type="submit" class="btn">Register & Get Link</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { signUpUser } from './js/auth.js';
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('error-alert');
      alert.style.display = 'none';
      try {
        await signUpUser(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value,
          document.getElementById('username').value.trim(),
          document.getElementById('display-name').value.trim()
        );
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert.innerText = err.message;
        alert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
